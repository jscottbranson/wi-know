name: Build and test
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  esp32c5:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      matrix:
        include:
          - role: universal
            id: 0
          - role: universal
            id: 0
            config: settings.universal.example.json
          - role: parent
            id: 0
          - role: parent
            id: 0
            config: settings.standalone.example.json
          - role: parent
            id: 0
            config: settings.standalone-wiring.example.json
          - role: parent
            id: 0
            config: settings.standalone-wiring.example.json
            board: xiao
          - role: parent
            id: 0
            config: settings.standalone-wiring.example.json
            board: n32r8
          - role: child
            id: 1
          - role: follower
            id: 2
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C firmware -B build -DIDF_TARGET=esp32c5 -DWIKNOW_ROLE=${{ matrix.role }} -DWIKNOW_NODE_ID=${{ matrix.id }} -DWIKNOW_BOARD=${{ matrix.board || 'custom' }} -DWIKNOW_CONFIG=$PWD/config/${{ matrix.config || 'settings.json' }} build
      - uses: actions/upload-artifact@v4
        if: matrix.role == 'universal'
        with:
          name: universal-${{ matrix.config || 'settings.json' }}
          path: |
            build/wi_know.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build/esp-idf/main/generated/settings.rules.json
            NOTICE
            LICENSE
            rules/sources/
          if-no-files-found: error

  esp32c5-gatt:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C firmware -B build-gatt -DIDF_TARGET=esp32c5 -DSDKCONFIG=$PWD/build-gatt/sdkconfig '-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.gatt.defaults' -DWIKNOW_CONFIG=$PWD/tests/fixtures/gatt/settings.json build
